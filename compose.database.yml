name: vectordb-local

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped

    environment:
      POSTGRES_USER: vectordb
      POSTGRES_PASSWORD: vectordb_local_dev
      POSTGRES_DB: vectordb

    ports:
      - '127.0.0.1:5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vectordb -d vectordb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
